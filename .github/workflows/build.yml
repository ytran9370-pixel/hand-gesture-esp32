name: build-firmware
on: [push, workflow_dispatch]

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bit-exact test of the C engine on Linux
        run: make -C host

  pc-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GoogleTest
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - name: Build C++ host library (warnings as errors, ASan/UBSan)
        run: |
          cmake -S pc_app -B build/pc_app
          cmake --build build/pc_app -j
      - name: Unit tests
        run: ctest --test-dir build/pc_app --output-on-failure

  build:
    runs-on: ubuntu-latest
    needs: host-test
    steps:
      - uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware (ESP-IDF in Docker)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s3
          path: firmware

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge into one .bin (flash at offset 0x0)
        run: |
          python -m pip install esptool
          cd firmware/build
          python -m esptool --chip esp32s3 merge_bin -o "$GITHUB_WORKSPACE/hand_gesture_merged.bin" @flash_args

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: hand_gesture_merged.bin
