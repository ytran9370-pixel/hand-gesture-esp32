name: build-firmware
on: [push, workflow_dispatch]

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bit-exact test of the C engine on Linux
        run: make -C host

  build:
    runs-on: ubuntu-latest
    needs: host-test
    steps:
      - uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware (ESP-IDF in Docker)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s3
          path: firmware

      - name: Merge into one .bin (flash at offset 0x0)
        run: |
          pip install esptool
          cd firmware/build
          python -m esptool --chip esp32s3 merge_bin -o hand_gesture_merged.bin @flash_args

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: firmware/build/hand_gesture_merged.bin
